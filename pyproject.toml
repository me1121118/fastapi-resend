description = "Fast, modern transactional email sender for FastAPI powered by Resend."
readme = "README.md"
license = "MIT"
authors = [{ name = "me1121118" }]
keywords = ["fastapi", "resend", "email", "transactional-email", "mailer"]
dependencies = [
    "fastapi>=0.100.0",
    "httpx>=0.25.0",
]
